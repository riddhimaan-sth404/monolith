[workspace]
resolver = "2"
members = [
    "shared",
    "backend",
    "agent",
    "protobuf",
    "cli",
    "matcher",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Web / HTTP
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace", "limit", "set-header"] }

# gRPC
tonic = { version = "0.12", features = ["tls", "tls-roots", "gzip"] }
prost = "0.13"
prost-types = "0.13"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# Cryptography
argon2 = "0.5"
jsonwebtoken = "9"
ring = "0.17"
rand = "0.8"
ed25519-dalek = { version = "2", default-features = false }
sha2 = "0.10"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
x509-parser = "0.17"

# TLS
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "fmt", "env-filter"] }
tracing-appender = "0.2"
tracing-opentelemetry = "0.28"

# Time / Scheduling
chrono = { version = "0.4", features = ["serde"] }
tokio-cron-scheduler = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Validation
validator = { version = "0.19", features = ["derive"] }

# Utilities
url = "2"
regex = "1"
glob = "0.3"
walkdir = "2"
lazy_static = "1"
once_cell = "1"
dashmap = { version = "6", features = ["serde"] }
itertools = "0.14"
hex = "0.4"
base64 = "0.22"
bitflags = "2"
snafu = "0.8"

# Compression
flate2 = "1"
zip = "2"
tar = "0.4"

# Windows-specific
windows-service = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_Networking_WinSock",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Kernel",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Power",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
] }

# PostgreSQL
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# PDF generation
printpdf = "0.7"

# HTTP client (for scanner communication)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Testing
criterion = { version = "0.5" }
testcontainers = "0.23"
tempfile = "3"
mockall = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "warn"
unused_qualifications = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
debug = false
