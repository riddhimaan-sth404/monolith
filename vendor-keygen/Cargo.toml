[workspace]
[package]
name = "vendor-keygen"
version = "1.0.0"
edition = "2024"
description = "Monolith EDR vendor key generation and license signing tool"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
