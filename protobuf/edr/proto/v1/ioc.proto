syntax = "proto3";

package edr.proto.v1;

import "google/protobuf/timestamp.proto";
import "edr/proto/v1/common.proto";

option go_package = "github.com/edr/scanner/internal/grpc/pb";

message IOC {
  string id = 1;
  IOCTYPE ioc_type = 2;
  string value = 3;

  // Classification
  Severity severity = 4;
  Confidence confidence = 5;
  repeated string tags = 6;

  // Context
  string description = 7;
  string source = 8;
  string reference = 9;

  // Lifecycle
  google.protobuf.Timestamp expires_at = 10;
  google.protobuf.Timestamp created_at = 11;
  string created_by = 12;
  google.protobuf.Timestamp updated_at = 13;
  string updated_by = 14;

  // Threat intelligence mapping
  string mitre_technique_id = 15;
  string mitre_tactic = 16;
  string malware_family = 17;

  // Comments
  repeated IOCComment comments = 20;
}

message IOCComment {
  string id = 1;
  string text = 2;
  string author = 3;
  google.protobuf.Timestamp created_at = 4;
}

message IOCollection {
  repeated IOC iocs = 1;
  uint32 total_count = 2;
  uint32 page = 3;
  uint32 page_size = 4;
}

message IOCFilter {
  repeated IOCTYPE ioc_types = 1;
  repeated Severity severities = 2;
  repeated Confidence confidences = 3;
  repeated string tags = 4;
  string search = 5;
  string source = 6;
  bool expired = 7;
  google.protobuf.Timestamp created_from = 8;
  google.protobuf.Timestamp created_to = 9;
  uint32 page = 10;
  uint32 page_size = 11;
}

message IOCImportRequest {
  string filename = 1;
  bytes content = 2;
  enum Format {
    FORMAT_UNSPECIFIED = 0;
    FORMAT_CSV = 1;
    FORMAT_JSON = 2;
    FORMAT_STIX = 3;
    FORMAT_XML = 4;
  }
  Format format = 3;
  bool dry_run = 4;
}

message IOCImportResult {
  uint32 total = 1;
  uint32 imported = 2;
  uint32 skipped = 3;
  uint32 duplicates = 4;
  uint32 errors = 5;
  repeated string error_messages = 6;
}
