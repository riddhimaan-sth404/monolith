[server]
host = "0.0.0.0"
port = 8443
grpc_port = 9443

[tls]
cert_path = "certs/server.pem"
key_path = "certs/server.key"
ca_cert_path = "certs/ca.pem"

[database]
kind = "sqlite"
path = "data/edr.db"
max_connections = 16

[logging]
level = "info"
format = "json"
directory = "logs"
rotation = "daily"
compression = true
max_files = 30

[rate_limiting]
enabled = true
requests_per_second = 100
burst_size = 200

[response_rules]
enabled = true
path = "configs/response_rules.toml"

[auth]
jwt_secret = "CHANGE_ME_GENERATE_SECURE_RANDOM_64_BYTES"
jwt_expiration_secs = 3600
refresh_expiration_secs = 86400
argon2_memory_cost = 19456
argon2_time_cost = 2
argon2_parallelism = 1

[notifications]
enabled = false
toast_script_path = "backend/scripts/send-toast.ps1"


