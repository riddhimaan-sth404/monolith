# Auto-Response Rules Configuration
# Each rule defines a condition, action, and cooldown period.
# Rules are evaluated in order; first match wins per alert.

[[rules]]
id = "auto_kill_known_bad_hash"
name = "Kill and quarantine known-bad hash"
enabled = true
action = "kill_and_quarantine"
cooldown_secs = 30
condition = { type = "composite", op = "and", conditions = [
  { type = "source", sources = ["ioc"] },
  { type = "min_severity", value = 5 },
] }

[[rules]]
id = "auto_isolate_credential_dumping"
name = "Isolate endpoint on credential dumping"
enabled = true
action = "isolate_endpoint"
cooldown_secs = 300
condition = { type = "correlation", correlation_types = ["credential_dumping"] }

[[rules]]
